```yaml
name: HabitFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f Dockerfile
          test -f nginx.conf

      - name: Build Docker image
        run: docker build -t habitflow:ci .

      - name: Start test container
        run: docker run -d --name habitflow-test -p 8080:10000 habitflow:ci

      - name: Inspect Nginx configuration
        run: docker exec habitflow-test nginx -t

      - name: Test local website
        run: |
          set -eu

          for i in $(seq 1 15); do
            if curl --connect-timeout 3 --max-time 5 \
              -fsS http://127.0.0.1:8080/ -o page.html; then
              break
            fi

            echo "Waiting for Nginx: attempt $i"
            sleep 2
          done

          test -s page.html
          grep -q "Small steps" page.html
          echo "Local website test passed!"

      - name: Test deployed Render website
        if: success() && github.event_name == 'push'
        run: |
          URL="https://habitflow-g4rj.onrender.com"

          for i in $(seq 1 30); do
            if curl --connect-timeout 5 --max-time 15 \
              -fsSL "$URL/" -o live-page.html &&
              grep -q "Small steps" live-page.html; then
              echo "Live website test passed!"
              exit 0
            fi

            echo "Waiting for Render deployment... attempt $i"
            sleep 10
          done

          echo "Live website test failed"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs habitflow-test
```
